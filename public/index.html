<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cờ Tỷ Phú Online</title><link rel="stylesheet" href="/style.css"></head><body>
<main id="app"><section id="lobby" class="panel"><h1>Cờ Tỷ Phú Online</h1><p>Tạo phòng, gửi mã phòng và chơi cùng bạn bè theo thời gian thực.</p><label>Tên của bạn<input id="name" maxlength="18" placeholder="Ví dụ: Hoàng"></label><label>Số người chơi<select id="limit"><option value="2">2 người</option><option value="3">3 người</option><option value="4" selected>4 người</option><option value="5">5 người</option><option value="6">6 người</option></select></label><div class="row"><button id="create">Tạo phòng</button><label>Mã phòng<input id="code" maxlength="5" placeholder="ABCDE"></label><button id="join">Vào phòng</button></div><p id="notice" class="notice"></p></section><section id="game" hidden>
<header><div><b>CỜ TỶ PHÚ</b><small id="room"></small></div><div id="turn"></div></header>
<section id="setup" class="panel" hidden><h2>Chọn quân và màu</h2><div id="setupIcons" class="icons"></div><div id="setupColors" class="colors"></div><button id="saveSetup">Chung thủy</button><button id="start">Bắt đầu ván</button></section>
<section class="game-grid"><aside id="players" class="players"></aside><section class="board-wrap"><div id="board" class="board"></div><section class="center panel"><h2 id="cellName">Chờ bắt đầu</h2><div id="dice" class="dice">🎲 🎲</div><p id="status"></p><div id="actions" class="actions"></div></section></section><aside class="panel history"><h3>Lịch sử</h3><div id="history"></div><button id="surrender" class="danger">Đầu hàng</button></aside></section>
</section></main><script src="/socket.io/socket.io.js"></script><script type="module" src="/app.js"></script></body></html>
